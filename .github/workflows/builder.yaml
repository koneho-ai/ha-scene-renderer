# Build and publish the scene-renderer add-on image to GHCR.
#
# Triggered when a GitHub release is published. Builds the default
# node-webgl variant for amd64 + aarch64, pushes per-arch images, and
# combines them into the multi-arch image ghcr.io/koneho-ai/ha-scene-renderer
# (the name config.yaml points at via `image:`).
#
# Release tags must match `version` in scene-renderer/config.yaml exactly
# (e.g. tag `0.1.0`, no `v` prefix): the Supervisor pulls the tag equal to
# `version`. See "Releasing" in the README.
#
# The workflow can also be run manually (Actions -> Build add-on image ->
# Run workflow) to test the build; manual runs build but do not push.
name: Build add-on image

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: ha-scene-renderer

permissions:
  contents: read

jobs:
  init:
    name: Initialize build
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - name: Get build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}

  build:
    name: Build ${{ matrix.arch }} image
    needs: init
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read # To check out the code
      id-token: write # Write needed for Cosign signing (issue OIDC token for signing)
      packages: write # To push built images to GitHub Container Registry
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: scene-renderer
          image: ${{ matrix.image }}
          image-tags: |
            ${{ github.event.release.tag_name || 'dev' }}
            ${{ github.event_name == 'release' && 'latest' || '' }}
          push: "${{ github.event_name == 'release' }}"
          skip-existing: ${{ github.event.release.tag_name }}
          version: ${{ github.event.release.tag_name || 'dev' }}
          # Default (lightest) variant. The puppeteer variant is built
          # locally with: docker build --build-arg RENDER_BACKEND=puppeteer
          build-args: |
            RENDER_BACKEND=node-webgl
          labels: |
            io.hass.type=addon
            io.hass.name=HA Scene Renderer
            io.hass.description=Renders a 3D model of your home lit by your real Home Assistant lights and the sun

  manifest:
    name: Publish multi-arch manifest
    needs: [init, build]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Write needed for Cosign signing (issue OIDC token for signing)
      packages: write # To push the manifest to GitHub Container Registry
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: |
            ${{ github.event.release.tag_name }}
            latest
          skip-existing: ${{ github.event.release.tag_name }}
