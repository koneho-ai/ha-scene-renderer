<!doctype html>
<!-- Render page for the Puppeteer backend. Served by server.mjs at
     /render-page; not for humans. Loads the same scene.mjs the node-webgl
     backend uses, so both backends render identically.
     The user script (scene.js) runs in a SES Compartment in this page:
     lockdown.umd.js (classic script, below) installs the lockdown /
     Compartment globals, and the module calls lockdown() before anything
     renders. If lockdown fails, scripting is disabled and rendering
     continues without it. -->
<html>
<head>
<meta charset="utf-8">
<title>HA Scene Renderer</title>
<script type="importmap">
{
  "imports": {
    "three": "/static/three/build/three.module.js",
    "three/addons/": "/static/three/examples/jsm/"
  }
}
</script>
<script src="/static/ses/dist/lockdown.umd.js"></script>
<style>html, body { margin: 0; padding: 0; background: #000; } canvas { display: block; }</style>
</head>
<body>
<script type="module">
import * as THREE from "three";
import * as sceneLib from "/static/scene.mjs";
import { compileScript } from "/static/script.mjs";

// SES lockdown: runs after the imports above evaluate (module imports are
// hoisted), so three.js loads before its intrinsics are hardened, and
// every scene object is created after. If it fails, scripting is
// unavailable but the page still renders.
let sesAvailable = false;
try {
  lockdown();
  sesAvailable = true;
} catch (err) {
  console.error(`SES lockdown failed (${err.message}) — scene.js scripting is disabled`);
}

const response = await fetch("/model.glb");
if (!response.ok) throw new Error(`failed to load model: HTTP ${response.status}`);
const model = await sceneLib.loadModel(await response.arrayBuffer());

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = sceneLib.BASE_EXPOSURE;
renderer.setPixelRatio(1);
document.body.appendChild(renderer.domElement);

// The compiled user script (or null). The compile result IS the handle:
// runScriptCall tracks lastError/errorCount on it. Kept as last-good: a
// failed compile leaves the previous script running.
let currentScript = null;

window.__lights = () => sceneLib.listLights(model.lights);
window.__cameraNames = () => sceneLib.getCameraNames(model);
window.__animations = () =>
  model.animations.map((clip) => ({ name: clip.name, duration: clip.duration }));
// Route scene.mjs log messages to the browser console; the puppeteer
// backend forwards console errors and warnings to the add-on log, so
// invalid cameras.yaml entries are visible there — matching the
// node-webgl backend, which passes its log straight through.
function pageLog(level, message) {
  if (level === "error") console.error(message);
  else if (level === "warning") console.warn(message);
  else console.log(message);
}
window.__cameras = ({ fileConfig, defaults }) =>
  sceneLib.listCameras(model, fileConfig || {}, defaults, pageLog);
// Compile a new user script (or clear it with null). Returns only plain
// data ({ ok, subscribe, error }) — the compiled handle holds a function
// and cannot cross page.evaluate.
window.__setScript = (source) => {
  if (source === null || source === undefined) {
    currentScript = null;
    return { ok: true, subscribe: [] };
  }
  if (!sesAvailable) {
    return { ok: false, error: "SES is not available in this page — scene.js cannot be loaded" };
  }
  const result = compileScript(source, { log: pageLog });
  if (!result.ok) return { ok: false, error: result.error };
  currentScript = result;
  return { ok: true, subscribe: result.subscribe };
};
window.__scriptInfo = () => ({
  present: currentScript !== null,
  lastError: currentScript ? currentScript.lastError : null,
  errorCount: currentScript ? currentScript.errorCount : 0,
});
// One frame of one camera. `cfg` is the resolved effective config (from
// __cameras); the page resolves the camera info by name. Returns a PNG
// data URL. The backend loops this for clip frames so it can abort
// between frames when a newer render request arrives.
window.__renderFrame = ({ name, lights, sun, entities, cfg, time, loop }) => {
  const info = sceneLib.getCameraInfo(model, name);
  if (!info) throw new Error(`unknown camera "${name}"`);
  return sceneLib.renderFrame({
    renderer,
    model,
    lights: lights || {},
    sun: sun ?? null,
    entities: entities || {},
    info,
    cfg,
    time,
    loop,
    script: currentScript,
    setSize: (w, h) => renderer.setSize(w, h, false),
    capture: () => renderer.domElement.toDataURL("image/png"),
    log: pageLog,
  });
};
window.__render = ({ lights, sun, entities, cameras, width, height, fileConfig }) =>
  sceneLib.renderCameras({
    renderer,
    model,
    lights: lights || {},
    sun: sun ?? null,
    entities: entities || {},
    script: currentScript,
    cameras,
    width,
    height,
    fileConfig: fileConfig || {},
    setSize: (w, h) => renderer.setSize(w, h, false),
    capture: () => renderer.domElement.toDataURL("image/png"),
    log: pageLog,
  });
window.__sceneReady = true;
</script>
</body>
</html>
